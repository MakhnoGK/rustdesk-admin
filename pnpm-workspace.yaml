packages:
  - apps/*
  - packages/*

# Install scripts are opt-in. argon2 ships a native binding; Prisma downloads its CLI engines.
allowBuilds:
  argon2: true
  prisma: true
  '@prisma/engines': true
  '@parcel/watcher': false
  '@scarf/scarf': false
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false
  unrs-resolver: false

# Versions published less than the release-age window ago, pinned on purpose.
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.7'
  - '@turbo/darwin-arm64@2.11.7'
  - '@turbo/linux-64@2.11.7'
  - '@turbo/linux-arm64@2.11.7'
  - '@turbo/windows-64@2.11.7'
  - '@turbo/windows-arm64@2.11.7'
  - eslint@10.12.0
  - nestjs-pino@5.3.1
  - pino@10.4.0
  - supertest@7.3.1
  - turbo@2.11.7
