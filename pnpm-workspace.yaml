packages:
  - apps/*
  - packages/*

# Install scripts are opt-in. argon2 ships a native binding; Prisma downloads its CLI engines.
allowBuilds:
  argon2: true
  prisma: true
  '@prisma/engines': true
  '@parcel/watcher': false
  '@scarf/scarf': false
  cpu-features: false
  esbuild: false
  # msw's postinstall copies the browser worker; the tests use msw/node only.
  msw: false
  protobufjs: false
  ssh2: false
  unrs-resolver: false

# Versions published less than the release-age window ago, pinned on purpose.
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.7'
  - '@turbo/darwin-arm64@2.11.7'
  - '@turbo/linux-64@2.11.7'
  - '@turbo/linux-arm64@2.11.7'
  - '@turbo/windows-64@2.11.7'
  - '@turbo/windows-arm64@2.11.7'
  - eslint@10.12.0
  - nestjs-pino@5.3.1
  - pino@10.4.0
  - supertest@7.3.1
  - turbo@2.11.7

# Security fixes in transitive dependencies of Prisma 7.10 (no patched 7.x release yet; drop these
# when Prisma ships them). Prisma's config loader only calls `deepmerge(a, b)`, unchanged in v8;
# mysql2 is a dependency of the CLI and never loaded with PostgreSQL.
overrides:
  deepmerge-ts@<8.0.0: 8.0.2 # GHSA-ggr8-5vv4-36mx
  mysql2@<3.23.1: 3.24.4 # GHSA-3f6p-5ww8-9rcr, GHSA-rgwj-5xj2-c3m3
